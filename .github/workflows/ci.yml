name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python python/scripts/check_engine.py
      - name: Exact simulator change inventory
        run: python python/scripts/audit_simulator.py --check
      - name: Reproducible BGA data resources
        run: python python/scripts/export_bga_data.py --check
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e './engine' -e './python[dev]'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - name: Python contracts, seeded engine replays and short PPO runs
        run: python -m pytest
        working-directory: python
      - name: Active BGA PPO smoke
        run: python python/scripts/train_decision_ppo.py --steps 64 --eval-games 2 --output-dir "$RUNNER_TEMP/bga-smoke"
      - name: Documented legacy entry points
        working-directory: python
        run: |
          python scripts/ppo_training/train_unified.py --help
          python scripts/ppo_training/eval_ppo_descriptives.py --help
          python scripts/benchmark_runtime.py --help
          python scripts/eval_selfplay.py --help
