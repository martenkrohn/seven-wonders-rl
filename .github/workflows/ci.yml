name: Checks
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - '.gitattributes'
      - '*.code-workspace'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - '.gitattributes'
      - '*.code-workspace'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            python/pyproject.toml
            python/constraints.txt
      - run: python python/scripts/check_engine.py
      - run: python python/scripts/export_bga_data.py --check
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -c python/constraints.txt -e './engine' -e './python[dev]'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - name: Active Python contracts, short training and recovery
        run: python -m pytest
        working-directory: python
