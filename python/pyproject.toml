[project]
name = "sevenwonders-rl"
version = "0.2.0"
description = "RL environment for 7 Wonders card game"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "gymnasium",
  "sevenwonders-engine-client>=0.2.0",
  "numpy",
  "torch",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sevenwonders_rl = ["data/*.json", "evaluation/assets/*.html", "evaluation/assets/*.css", "evaluation/assets/*.js"]
