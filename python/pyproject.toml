[project]
name = "sevenwonders-rl"
version = "0.2.0"
description = "Partial-information PPO and snapshot self-play for 7 Wonders Second Edition"
requires-python = ">=3.10"
readme = {file = "scripts/README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "gymnasium",
  "sevenwonders-engine-client>=0.2.0",
  "numpy",
  "torch",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.urls]
Repository = "https://github.com/martenkrohn/seven-wonders-rl"
Documentation = "https://github.com/martenkrohn/seven-wonders-rl/tree/main/docs"
Demo = "https://martenkrohn.github.io/seven-wonders-rl/"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sevenwonders_rl = ["data/*.json", "evaluation/assets/*.html", "evaluation/assets/*.css", "evaluation/assets/*.js"]
